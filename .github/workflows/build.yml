name: Build Jellyfin Reshet 13

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Reshet13/Jellyfin.Plugin.Reshet13.csproj

      - name: Build
        run: >
          dotnet build
          Jellyfin.Plugin.Reshet13/Jellyfin.Plugin.Reshet13.csproj
          --configuration Release
          --no-restore
